<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦蝶幽谷-据点战防守符文配置卡片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: #1a1a2e; color: #e0e0e0; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
#lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  z-index: 10; background: #1a1a2e; }
#lock .card { max-width: 380px; width: 90%; text-align: center; padding: 40px 32px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,215,0,0.25); border-radius: 12px; }
#lock .icon { font-size: 42px; margin-bottom: 16px; }
#lock h1 { font-size: 17px; color: #ffd700; margin-bottom: 8px; }
#lock p { font-size: 12px; color: #888; margin-bottom: 22px; line-height: 1.7; }
#lock input { width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 8px;
  border: 1px solid rgba(255,215,0,0.3); background: #16162a; color: #e0e0e0; outline: none;
  text-align: center; letter-spacing: 2px; }
#lock input:focus { border-color: #ffd700; }
#lock button { width: 100%; margin-top: 14px; padding: 12px; font-size: 15px; border: none;
  border-radius: 8px; background: rgba(255,215,0,0.15); color: #ffd700; cursor: pointer;
  border: 1px solid rgba(255,215,0,0.4); }
#lock button:hover { background: rgba(255,215,0,0.25); }
#lock .err { color: #ef5350; font-size: 12px; margin-top: 10px; min-height: 16px; }
#lock .hint { font-size: 11px; color: #555; margin-top: 16px; }
#frame { position: fixed; inset: 0; width: 100%; height: 100%; border: none; display: none; z-index: 5; }
#topbar { position: fixed; top: 18px; right: 20px; z-index: 20; display: none;
  align-items: center; gap: 10px; }
#refreshBtn { background: rgba(20,26,46,0.88); color: #ffd700; border: 1px solid rgba(255,215,0,0.4);
  border-radius: 8px; padding: 7px 15px; font-size: 13px; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; gap: 6px; backdrop-filter: blur(3px); }
#refreshBtn:hover { background: rgba(255,215,0,0.2); }
#refreshBtn .ico { display: inline-block; font-size: 15px; }
#refreshBtn.loading .ico { animation: rspin 0.8s linear infinite; }
@keyframes rspin { to { transform: rotate(360deg); } }
#tip { max-width: 340px; font-size: 12px; color: #ffab40; background: rgba(0,0,0,0.66);
  border: 1px solid rgba(255,171,64,0.35); border-radius: 8px; padding: 5px 11px;
  text-align: right; display: none; }
#tip.err { color: #ff8a80; border-color: rgba(255,138,128,0.4); }
#tip.ok { color: #9be29b; border-color: rgba(155,226,155,0.35); }
</style>
</head>
<body>
<div id="lock">
  <div class="card">
    <div class="icon">&#128274;</div>
    <h1>该页面已加密</h1>
    <p>请输入访问密码解锁内容<br>内容在您的浏览器本地解密, 不会上传到任何服务器</p>
    <input type="password" id="pw" placeholder="输入密码" autocomplete="off">
    <button onclick="unlock()">解锁</button>
    <div class="err" id="err"></div>
    <div class="hint">密码错误时不会显示任何内容提示以外的信息</div>
  </div>
</div>
<div id="topbar">
  <div id="tip"></div>
  <button id="refreshBtn" onclick="doRefresh()" title="拉取最新发布的据点战数据并解密 (无需重输密码)">
    <span class="ico">&#8635;</span> 刷新数据
  </button>
</div>
<iframe id="frame" title="content"></iframe>
<script>
var _DATA_URL = './SIEGE_DATA_MENGDIE.bin';
var _PBKDF_ROUNDS = 150000;
var _pwKeep = null;      // 仅存窗口内存变量, 不落盘
function $(id) { return document.getElementById(id); }
function b64s(b) { return atob(b).split('').map(function(c){return c.charCodeAt(0);}); }

function tip(msg, cls, show) {
  var t = $('tip');
  if (show === false) { t.style.display = 'none'; return; }
  t.textContent = msg || '';
  t.className = cls || '';
  t.style.display = 'block';
}

async function fetchPayload() {
  var r = await fetch(_DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function deriveKey(pw, saltB64) {
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: new Uint8Array(b64s(saltB64)), iterations: _PBKDF_ROUNDS, hash: 'SHA-256'},
    km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
}

async function decryptPayload(D, pw) {
  var key = await deriveKey(pw, D.s);
  var pt = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: new Uint8Array(b64s(D.n)), tagLength: 128},
    key, new Uint8Array(b64s(D.c).concat(b64s(D.t))));
  return new TextDecoder().decode(pt);
}

function showContent(html) {
  var f = $('frame');
  f.style.display = 'block';
  $('lock').style.display = 'none';
  $('topbar').style.display = 'flex';
  var doc = f.contentDocument || f.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
}

async function unlock() {
  var pw = $('pw').value;
  var err = $('err');
  err.textContent = '';
  if (!pw) { err.textContent = '请输入密码'; return; }
  try {
    var D = await fetchPayload();
    var html = await decryptPayload(D, pw);
    _pwKeep = pw;      // 解锁成功后暂存, 供后续刷新 (仅本窗口存活)
    showContent(html);
  } catch (e) {
    _pwKeep = null;
    err.textContent = (String(e).indexOf('HTTP') === 0) ? ('数据拉取失败: ' + e) : '密码错误或解密失败';
  }
}

async function doRefresh() {
  if (!_pwKeep) return;
  var btn = $('refreshBtn');
  btn.classList.add('loading');
  tip('正在拉取最新数据...', '');
  try {
    var D = await fetchPayload();
    var html = await decryptPayload(D, _pwKeep);
    // 记滚动位置 (页面在 iframe 内)
    var f = $('frame');
    var sy = 0;
    try { sy = (f.contentWindow && f.contentWindow.scrollY) || 0; } catch (e) {}
    showContent(html);
    try { if (sy) f.contentWindow.scrollTo(0, sy); } catch (e) {}
    var st = f.contentDocument ? (f.contentDocument.title || '') : '';
    tip('已更新到最新数据 (' + new Date().toLocaleTimeString() + ')', 'ok');
    setTimeout(function() { tip('', '', false); }, 4000);
  } catch (e) {
    tip('刷新失败: ' + (String(e).indexOf('HTTP') === 0 ? '数据拉取失败(稍后再试)' : '解密失败'), 'err');
  }
  btn.classList.remove('loading');
}

$('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});
</script>
</body>
</html>
